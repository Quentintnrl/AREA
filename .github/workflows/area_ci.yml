name: area_ci

on:

  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:

  get_pr_info:
      runs-on: ubuntu-latest
      steps:
        - name: Check if it's a pull request
          run: |
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              if [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
                if [[ "${{ github.event.pull_request.head.ref }}" != "dev" ]]; then
                  exit 1
                fi
              elif [[ "${{ github.event.pull_request.base.ref }}" == "dev" ]]; then
                if [[ "${{ github.event.pull_request.head.ref }}" != "main" &&
                      "${{ github.event.pull_request.head.ref }}" != "web_app" &&
                      "${{ github.event.pull_request.head.ref }}" != "mobile_app" &&
                      "${{ github.event.pull_request.head.ref }}" != "back_end" ]]; then
                    exit 1
                fi
              fi
            fi

  install_dependencies:
    name: Install Dependencies
    needs: get_pr_info
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install nodejs
          npm install mysql
          sudo apt install mysql-server

  run_tests:
    name: Run tests
    needs: install_dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install nodejs
          npm install mysql
          sudo apt install mysql-server

      - name: Run tests
        run: |