  react-native-app:
    image: reactnativecommunity/react-native-android:latest
    container_name: react-native-app
    environment:
      - ANDROID_HOME=/opt/android-sdk-linux
      - PATH=/opt/android-sdk-linux/platform-tools:/opt/android-sdk-linux/tools:/opt/android-sdk-linux/cmdline-tools/latest/bin:$PATH
    volumes:
      - ./android:/app
    working_dir: /app
    command: >
      bash -c "yarn install && yarn add react-native@0.76.6 && npx react-native run-android"
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true

networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge

volumes:
  mysql_data:
